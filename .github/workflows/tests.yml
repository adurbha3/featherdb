name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run the test suite
        run: PYTHONPATH=. pytest tests/ -v

      - name: Smoke-test the CLI
        run: |
          PYTHONPATH=. python3 -m featherdb.cli --db /tmp/ci_db insert '{"name": "Ada", "lang": "C++"}'
          PYTHONPATH=. python3 -m featherdb.cli --db /tmp/ci_db index lang
          PYTHONPATH=. python3 -m featherdb.cli --db /tmp/ci_db find-by lang C++

      - name: Run the benchmark script
        run: PYTHONPATH=. python3 scripts/benchmark.py
